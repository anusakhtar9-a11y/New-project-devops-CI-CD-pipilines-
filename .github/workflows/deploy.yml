name: Build and Deploy to EC2

on:
  push:
    branches:
      - main  # Jab main branch par push hoga tabhi yeh chalega

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Code Checkout
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Docker Hub Login
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 3. Docker Image Build and Push
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./"S3 static website hosting file (1)/static-website-example-master" # Apne subfolder ka path yahan dein
        file: ./"S3 static website hosting file (1)/static-website-example-master"/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-web-app:latest

    # 4. SSH into EC2 and Deploy Container
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Docker Hub se latest image pull karein
          sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/my-web-app:latest
          
          # Pehle se chalte hue purane container ko stop aur remove karein (agar exist karta hai)
          sudo docker stop my-web-app-container || true
          sudo docker rm my-web-app-container || true
          
          # Naya Container run karein (Port 80 ko map karte hue)
          sudo docker run -d --name my-web-app-container --restart always -p 80:80 ${{ secrets.DOCKERHUB_USERNAME }}/my-web-app:latest
          
          # Unused Docker Images cleanup karein
          sudo docker image prune -f
